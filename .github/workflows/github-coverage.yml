name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-javascript:
    name: Open-Generative-AI coverage (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/Open-Generative-AI
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Run tests with coverage
        shell: bash
        run: npm run test:coverage

      - name: Convert lcov to Cobertura XML
        shell: bash
        run: |
          pip install --quiet lcov_cobertura
          python3 -m lcov_cobertura coverage/lcov.info -o coverage/cobertura.xml -b .

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-javascript
          path: platforms/Open-Generative-AI/coverage/cobertura.xml

  upload-coverage-javascript:
    needs: coverage-javascript
    if: ${{ !cancelled() && needs.coverage-javascript.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-javascript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: JavaScript
          label: code-coverage-agent
